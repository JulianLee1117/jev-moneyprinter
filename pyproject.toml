[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-alpha-research"
version = "0.1.0"
description = "Source-grounded experiments for Jev-assisted financial research"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
procurement = ["pypdf>=4"]

[project.scripts]
jev-alpha = "jev_alpha.cli:main"

[tool.setuptools.packages.find]
include = ["jev_alpha*"]
